services:
  postgres:
    image: postgres:16-alpine
    container_name: pathflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathflow
      POSTGRES_PASSWORD: pathflow_secret
      POSTGRES_DB: pathflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
